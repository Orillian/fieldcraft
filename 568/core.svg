<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="960" height="560" fill="#1d2129"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a94a6"/></marker></defs>
<text x="480" y="38" fill="#dde2ea" font-size="22" font-weight="700" text-anchor="middle">FieldCraft Remote: the core first</text>
<text x="480" y="62" fill="#8a94a6" font-size="14" text-anchor="middle">one job API, pluggable providers, the same engine everywhere</text>
<!-- clients -->
<g font-size="14" fill="#dde2ea" text-anchor="middle">
<rect x="40" y="96" width="880" height="64" rx="10" fill="#262c36" stroke="#3a4352"/>
<text x="80" y="122" text-anchor="start" fill="#8a94a6" font-size="12">CLIENTS (later: thin)</text>
<rect x="210" y="108" width="140" height="40" rx="8" fill="#2d4e70"/><text x="280" y="133">fieldcraft-cli</text>
<rect x="370" y="108" width="140" height="40" rx="8" fill="#2d4e70"/><text x="440" y="133">MCP agent</text>
<rect x="530" y="108" width="140" height="40" rx="8" fill="#2d4e70" opacity="0.55"/><text x="600" y="133" fill="#aab3c2">desktop app</text>
<rect x="690" y="108" width="140" height="40" rx="8" fill="#2d4e70" opacity="0.55"/><text x="760" y="133" fill="#aab3c2">any browser</text>
</g>
<line x1="480" y1="162" x2="480" y2="196" stroke="#8a94a6" stroke-width="2" marker-end="url(#a)"/>
<text x="492" y="184" fill="#f0b44a" font-size="13">Job API: Submit · Watch · Cancel · Fetch → handle = id + token</text>
<!-- server -->
<rect x="200" y="200" width="560" height="96" rx="10" fill="#262c36" stroke="#4f9ce8" stroke-width="2"/>
<text x="480" y="228" fill="#dde2ea" font-size="17" font-weight="700" text-anchor="middle">fieldcraft serve</text>
<text x="480" y="252" fill="#aab3c2" font-size="14" text-anchor="middle">job log (SQLite) · queue · progress fan-out · result store or pointer</text>
<text x="480" y="274" fill="#8a94a6" font-size="12" text-anchor="middle">one process, self-hosted first; runs on a laptop, a VM or a pod</text>
<line x1="480" y1="298" x2="480" y2="332" stroke="#8a94a6" stroke-width="2" marker-end="url(#a)"/>
<text x="492" y="320" fill="#8a94a6" font-size="13">trait Provider: launch · status · stop</text>
<!-- providers -->
<g font-size="14" text-anchor="middle">
<rect x="40" y="336" width="880" height="88" rx="10" fill="#262c36" stroke="#3a4352"/>
<text x="80" y="358" text-anchor="start" fill="#8a94a6" font-size="12">PROVIDERS (one at a time)</text>
<rect x="70" y="368" width="180" height="44" rx="8" fill="#2d4e70"/><text x="160" y="395" fill="#dde2ea">Local process</text>
<rect x="270" y="368" width="180" height="44" rx="8" fill="#2d4e70"/><text x="360" y="395" fill="#dde2ea">Your machine (dials out)</text>
<rect x="470" y="368" width="200" height="44" rx="8" fill="#2d4e70" opacity="0.55"/><text x="570" y="395" fill="#aab3c2">Lambda: rent, run, release</text>
<rect x="690" y="368" width="200" height="44" rx="8" fill="#2d4e70" opacity="0.55"/><text x="790" y="395" fill="#aab3c2">Kubernetes Job</text>
</g>
<line x1="480" y1="426" x2="480" y2="460" stroke="#8a94a6" stroke-width="2" marker-end="url(#a)"/>
<text x="492" y="448" fill="#8a94a6" font-size="13">signed release image / binary (minisign), never ad-hoc uploads</text>
<rect x="250" y="464" width="460" height="64" rx="10" fill="#262c36" stroke="#4f9ce8" stroke-width="2"/>
<text x="480" y="490" fill="#dde2ea" font-size="16" font-weight="700" text-anchor="middle">fieldcraft-cli worker</text>
<text x="480" y="512" fill="#aab3c2" font-size="13" text-anchor="middle">same engine · one job spec · progress · .fieldcraft + results</text>
<text x="930" y="548" fill="#5f6b7d" font-size="11" text-anchor="end">solid: first milestone · faded: after</text>
</svg>
